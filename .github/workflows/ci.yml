name: Windows CI
on:
  push:
    branches: [ main, "dev/**" ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore KBlue.sln
      - name: Build
        run: dotnet build KBlue.sln -c Release --no-restore
      - name: Tests
        run: dotnet test tests/KBlue.Tests/KBlue.Tests.csproj -c Release --no-build
